<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أنا | مساعدك الشخصي الذكي</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
    <div class="app">
        <!-- Mobile overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <div class="logo-icon">أنا</div>
                <span class="logo-text">المساعد الشخصي</span>
                <button class="close-sidebar" onclick="closeSidebar()">✕</button>
            </div>
            
            <button class="new-chat-btn" onclick="startNewChat()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                محادثة جديدة
            </button>

            <div class="nav-tabs">
                <button class="nav-tab active" onclick="setMode('chat')">💬 المحادثة</button>
                <button class="nav-tab" onclick="setMode('image')">🖼️ إنشاء صورة</button>
                <button class="nav-tab" onclick="setMode('video')">🎬 إنشاء فيديو</button>
            </div>

            <!-- Chat History -->
            <div class="history-section">
                <div class="history-header">
                    <h3>سجل المحادثات</h3>
                    <button class="clear-history-btn" onclick="clearAllHistory()" title="مسح الكل">🗑️</button>
                </div>
                <div class="history-list" id="historyList">
                    <!-- filled by JS -->
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar">أ</div>
                    <div>
                        <div class="user-name">أنت</div>
                        <div class="user-status">متصل</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="header-left">
                    <button class="menu-btn" onclick="openSidebar()">☰</button>
                    <div class="header-info">
                        <div class="assistant-avatar">أنا</div>
                        <div>
                            <h1>أنا</h1>
                            <p class="status"><span class="dot"></span> جاهز لمساعدتك</p>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="toggleTheme()" title="تبديل المظهر" id="themeBtn">🌙</button>
                </div>
            </header>

            <div class="messages" id="messages">
                <div class="welcome">
                    <div class="welcome-icon">أنا</div>
                    <h2>مرحباً بك</h2>
                    <p>أنا مساعدك الشخصي الذكي الحقيقي.<br>
                    أقدر أرد عليك نصياً أو <strong>بالفيديو</strong> أو <strong>بالصوت</strong>.</p>
                    <div class="suggestions">
                        <button onclick="sendQuick('كيف أبدأ يومي بشكل منتج؟')">كيف أبدأ يومي بشكل منتج؟</button>
                        <button onclick="sendQuick('رد بالفيديو: اشرح لي كيف أكون منتج')">رد بالفيديو 🎬</button>
                        <button onclick="setMode('image'); document.getElementById('userInput').focus();">أنشئ لي صورة</button>
                        <button onclick="setMode('video'); document.getElementById('userInput').focus();">أنشئ لي فيديو</button>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="chat" onclick="setMode('chat')">💬 محادثة</button>
                    <button class="mode-btn" data-mode="image" onclick="setMode('image')">🖼️ صورة</button>
                    <button class="mode-btn" data-mode="video" onclick="setMode('video')">🎬 فيديو</button>
                </div>
                <div class="input-wrapper">
                    <textarea 
                        id="userInput" 
                        placeholder="اكتب رسالتك... أو قل رد بالفيديو"
                        rows="1"
                        onkeydown="handleKey(event)"
                    ></textarea>
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <p class="disclaimer">أنا • ذكاء اصطناعي حقيقي • صوت + فيديو + صور • سجل محفوظ محلياً</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
