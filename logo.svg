<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g" x1="28" y1="18" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00DDFF"/>
      <stop offset="0.45" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Q ring -->
  <circle cx="90" cy="90" r="58" stroke="url(#g)" stroke-width="20" fill="none" filter="url(#soft)"/>
  <!-- Q tail -->
  <path d="M128 128 L162 162" stroke="url(#g)" stroke-width="20" stroke-linecap="round" filter="url(#soft)"/>
  <!-- accent slash like brand -->
  <path d="M132 122 L158 96" stroke="url(#g)" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
</svg>
